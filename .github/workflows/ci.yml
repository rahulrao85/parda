name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System packages (ffmpeg, DejaVu fonts for the drawn test images)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python packages (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest

      # The RapidOCR models ship inside the rapidocr-onnxruntime wheel, so there is nothing else to cache.
      # No secrets: api and slow tests are opt-in (see pytest.ini).
      - name: Tests
        run: pytest -m "not api and not slow" --durations=15
